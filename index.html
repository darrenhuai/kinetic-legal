<style>
  :root{ --bg:#f6f7f9; --card:#fff; --border:#e5e7eb; --ink:#0c1220; --muted:#5b6472; --accent:#2563eb; }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:720px; margin:0 auto; padding:40px 20px 80px}
  .brand{display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:-.01em; margin-bottom:28px}
  .brand .dot{width:26px; height:26px; border-radius:7px; background:var(--accent); display:grid; place-items:center}
  .brand .dot svg{width:15px; height:15px}
  .card{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:34px 30px;
    box-shadow:0 10px 30px -18px rgba(12,18,32,.25)}
  h1{font-size:28px; letter-spacing:-.02em; margin:0 0 6px}
  h2{font-size:17px; margin:30px 0 8px; letter-spacing:-.01em}
  p{margin:10px 0; color:#1c2431}
  ul{margin:10px 0; padding-left:22px}
  li{margin:6px 0}
  em{color:var(--muted); font-style:normal; font-size:14px}
  a{color:var(--accent); text-decoration:none}
  a:hover{text-decoration:underline}
  strong{font-weight:650}
  .foot{margin-top:26px; font-size:13px; color:var(--muted); text-align:center}
  .foot a{color:var(--muted); text-decoration:underline}
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0b0f17; --card:#121826; --border:#232b3a; --ink:#eef2f7; --muted:#94a0b3; }
    body{color:#e7ecf3} p{color:#cdd5e2}
  }
</style>
</head>
